<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoidPixlr — pixel art</title>
<meta name="description" content="A pixel-art canvas for 16, 32 and 64 pixel square art. Pick a palette, draw, save it as a PNG — in your browser, with nothing ever uploaded.">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d0d0f'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%234f4fff'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23e8e8ea'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- ── Top bar ──────────────────────────────────────────────────────────── -->
  <!-- Every group is labelled. A bare "G" or a naked row of numbers gave no
       clue what it was; the label says what the group is, and the button
       says what the group is doing. -->
  <header class="top-bar" id="top">
    <span class="wordmark">VoidPixlr</span>

    <div class="group" role="group" aria-label="Canvas size">
      <span class="group-label">Size</span>
      <select id="size" class="select size-select" aria-label="Canvas size"></select>
    </div>

    <div class="group" role="group" aria-label="Grid lines">
      <span class="group-label">Grid</span>
      <button type="button" class="btn" id="grid-toggle" title="Grid lines (G)">on</button>
    </div>

    <div class="group" role="group" aria-label="Symmetry">
      <span class="group-label">Symmetry</span>
      <button type="button" class="btn" id="symmetry-toggle" title="Symmetry (S)">off</button>
    </div>

    <button type="button" class="btn" id="undo">Undo</button>
    <button type="button" class="btn" id="redo">Redo</button>
  </header>

  <!-- ── The alert bar ────────────────────────────────────────────────────── -->
  <!-- A failed load used to write its message into a panel that was hidden,
       so the app said nothing at all. This is always where it goes. -->
  <div class="alert" id="alert" hidden>
    <span class="alert-text" id="alert-text"></span>
    <button type="button" class="btn" id="alert-dismiss">Dismiss</button>
  </div>

  <!-- ── Inline panels ────────────────────────────────────────────────────── -->
  <div class="panel-row" id="panels">
    <div class="inline-panel" id="resize-panel" hidden>
      <span id="resize-label">Resize?</span>
      <button type="button" class="btn" id="resize-confirm">Resize</button>
      <button type="button" class="btn" id="resize-cancel">Cancel</button>
    </div>

    <div class="inline-panel" id="export-panel" hidden>
      <span class="panel-label">PNG scale</span>
      <button type="button" class="btn" id="export-scale-1">1&times;</button>
      <button type="button" class="btn" id="export-scale-4">4&times;</button>
      <button type="button" class="btn" id="export-scale-8">8&times;</button>
      <button type="button" class="btn" id="export-scale-16">16&times;</button>
      <button type="button" class="btn" id="export-scale-32">32&times;</button>
      <button type="button" class="btn" id="export-background">Background: transparent</button>
    </div>

    <div class="inline-panel" id="import-panel" hidden>
      <button type="button" class="btn" id="import-json">Import JSON&hellip;</button>
      <button type="button" class="btn" id="import-png">Import PNG&hellip;</button>
      <span class="panel-label">JSON palette</span>
      <button type="button" class="btn import-mode is-active" id="import-adopt">Adopt the file&rsquo;s</button>
      <button type="button" class="btn import-mode" id="import-remap">Remap to mine</button>
      <button type="button" class="btn" id="import-scale" hidden>Scale</button>
      <button type="button" class="btn" id="import-crop" hidden>Crop top-left</button>
      <span class="panel-error" id="import-error"></span>
    </div>
  </div>

  <!-- ── The menu ─────────────────────────────────────────────────────────── -->
  <!-- One column, on the left, and everything in it drops open. The colours
       are a pop-over rather than a section: a sixty-four swatch grid takes
       more room than the whole menu, and it is wanted for a moment at a
       time, not all the time. -->
  <aside class="sidebar" id="sidebar">

    <div class="menu" id="menu">

      <!-- The palette. -->
      <section class="menu-section" data-section="palette">
        <button type="button" class="menu-head" id="palette-head" aria-expanded="true" aria-controls="menu-palette">
          <span class="menu-head-label">Palette</span>
          <span class="menu-head-meta" id="palette-summary">Void Palette</span>
        </button>
        <div class="menu-body" id="menu-palette">
          <label class="side-label" for="palette-select">Use</label>
          <select id="palette-select" class="select"></select>

          <label class="side-label" for="palette-name">Name</label>
          <input type="text" id="palette-name" class="text-input" aria-label="Palette name" placeholder="palette name">

          <div class="side-row wrap">
            <button type="button" class="btn" id="palette-save">Save</button>
            <button type="button" class="btn" id="palette-duplicate">Copy</button>
            <button type="button" class="btn" id="palette-delete">Delete</button>
          </div>

          <p class="side-note" id="sidebar-note"></p>
        </div>
      </section>

      <!-- The colours: a pop-over, not a panel. -->
      <section class="menu-section" data-section="colours">
        <button type="button" class="menu-head" id="colours-toggle" aria-expanded="false" aria-controls="colour-popover">
          <span class="menu-head-label">Colours</span>
          <span class="menu-head-meta">
            <span class="menu-chip" id="colour-chip" aria-hidden="true"></span>
            <span id="palette-count">16 colours</span>
          </span>
        </button>
      </section>

    </div>

    <!-- The colour picker. It floats over the canvas instead of taking room
         in the menu, and it is positioned in script so it can never open
         off the edge of the window. -->
    <div class="popover" id="colour-popover" hidden aria-label="Colour picker">
      <div class="swatch-grid" id="swatch-grid"></div>
      <p class="side-note accent-note" id="palette-stage-note" hidden></p>

      <div class="side-row wrap">
        <button type="button" class="btn" id="palette-add">+ Add</button>
        <button type="button" class="btn" id="palette-reorder">Reorder</button>
        <button type="button" class="btn" id="palette-remove">Remove</button>
      </div>

      <label class="side-label" for="colour-input">Active colour</label>
      <div class="side-row">
        <input type="color" id="colour-input" aria-label="Pick a colour">
        <input type="text" id="colour-hex" class="text-input hex-input" aria-label="Hex colour" placeholder="#rrggbb" spellcheck="false">
      </div>
    </div>

  </aside>

  <!-- ── Centre ───────────────────────────────────────────────────────────── -->
  <!-- One canvas. The whole app. -->
  <main class="centre" id="centre">

    <div class="canvas-view" id="canvas-view">
      <div class="pane-head">
        <span class="pane-label">Canvas</span>
        <span class="pane-tools">
          <input type="range" id="canvas-zoom" min="0" max="100" value="50" aria-label="Canvas zoom">
          <span class="readout" id="canvas-zoom-readout">16&times;</span>
          <button type="button" class="btn" id="canvas-fit" title="Fit the canvas to the pane">Fit</button>
        </span>
      </div>
      <div class="canvas-region" id="canvas-region">
        <canvas class="art-canvas" id="art-canvas" width="256" height="256"></canvas>
      </div>
    </div>

  </main>

  <!-- ── Bottom bar ───────────────────────────────────────────────────────── -->
  <!-- The artwork's own lifecycle: make it, bring it in, take it out. The top
       bar is for working on it. -->
  <footer class="bottom-bar" id="bottom">
    <button type="button" class="btn" id="new-canvas" title="New (R)">New</button>
    <button type="button" class="btn" id="import">Import</button>
    <button type="button" class="btn" id="export-png">Export PNG</button>
    <button type="button" class="btn" id="export-json">Export JSON</button>
    <button type="button" class="btn" id="copy-png">Copy PNG</button>
    <span class="spacer"></span>
    <div class="kofi-wrap" id="kofi">
      <script type="text/javascript" src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
      <script type="text/javascript" src="js/kofi.js"></script>
    </div>
    <button type="button" class="btn dim" id="forget">Forget everything</button>
  </footer>

</div>

<!-- Hidden file inputs. Nothing is uploaded — these files are read locally. -->
<input type="file" id="file-json" accept="application/json,.json" hidden>
<input type="file" id="file-png" accept="image/png" hidden>

<script src="js/quantise.js"></script>
<script src="js/palette.js"></script>
<script src="js/history.js"></script>
<script src="js/storage.js"></script>
<script src="js/canvas.js"></script>
<script src="js/io.js"></script>
<script src="js/menu.js"></script>
<script src="js/app.js"></script>
</body>
</html>

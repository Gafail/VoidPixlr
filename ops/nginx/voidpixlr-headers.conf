# VoidPixlr — the site's own security headers.
#
# This is the house snippet (ops/nginx-snippets/security-headers.conf) with
# one change: the CSP is widened by exactly the origins the Ko-fi widget
# needs, and nothing else.
#
# Why a per-site copy instead of the shared snippet:
#
#   The house snippet says so itself — "Adjust per-site CSP as needed. Or
#   copy and customize per-site." The Ko-fi widget is a third-party script
#   (storage.ko-fi.com) that draws an iframe (ko-fi.com), and neither is
#   permitted by `script-src 'self'` / `frame-src`. Two `add_header`
#   directives for the same name in one block send *both* headers, and the
#   browser enforces the stricter of the two — so the shared snippet cannot
#   simply be included alongside an override. Copying it is the way the
#   snippet documents.
#
#   This weakens this site only. Every other site keeps the shared policy.
#
# The change, in full:
#
#   script-src  + https://storage.ko-fi.com   the widget script
#   style-src   + https://fonts.googleapis.com the font the widget asks for
#   font-src    + https://fonts.gstatic.com    the font files
#
# That is the whole list, and it is smaller than it looks:
#
#   * img-src is untouched. The shared policy already allows `https:`, and
#     the cup image comes from storage.ko-fi.com.
#   * frame-src stays empty. Widget v2 draws a styled <a>, not an iframe.
#   * connect-src stays 'self'. The widget makes no XHR.
#   * default-src, media-src and style-src's own house rules are unchanged,
#     and script-src still has no 'unsafe-inline' — so the app still has no
#     inline script and no inline event handlers, and the browser suites
#     still prove it.
#
# Everything else — img-src, media-src, style-src, font-src, default-src —
# is byte-for-byte the house policy. There is no 'unsafe-inline' in
# script-src, so the app still has no inline script and no inline event
# handlers, and the browser suites still prove it.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; script-src 'self' https://storage.ko-fi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com;" always;
